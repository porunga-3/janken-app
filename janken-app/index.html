<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>じゃんけん</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 最初のボタン画面 -->
    <div id="menu">

        <button
            class="goo"
            onclick="showImage('images/goo.jpeg')">
            グー
        </button>

        <button
            class="choki"
            onclick="showImage('images/choki.jpeg')">
            チョキ
        </button>

        <button
            class="paa"
            onclick="showImage('images/paa.jpeg')">
            パー
        </button>

    </div>


    <!-- 画像だけを表示する画面 -->
    <div id="imageScreen" onclick="backToMenu()">

        <img
            id="jankenImage"
            src=""
            alt="じゃんけん画像"
        >

    </div>


    <script src="script.js"></script>

</body>
</html>
